<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JSeek Enhancer Options</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f9fafb;
    color: #111827;
    width: 420px;
    padding: 20px;
  }
  h1 { font-size: 16px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #6b7280; margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin: 10px 0 4px; }
  input, textarea {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  button {
    padding: 8px 16px;
    border: 1px solid #1d4ed8;
    border-radius: 6px;
    background: #1d4ed8;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #1e40af; }
  #status { font-size: 12px; color: #059669; font-weight: 600; }
</style>
</head>
<body>
  <h1>JSeek Enhancer</h1>
  <p class="sub">Profile used by the ATS Auto-Fill button. Leave a field blank to use the built-in default.</p>

  <div class="row">
    <div>
      <label for="firstName">First Name</label>
      <input id="firstName">
    </div>
    <div>
      <label for="lastName">Last Name</label>
      <input id="lastName">
    </div>
  </div>

  <label for="email">Email</label>
  <input id="email" type="email">

  <label for="phone">Phone</label>
  <input id="phone" type="tel">

  <label for="linkedin">LinkedIn URL</label>
  <input id="linkedin" type="url">

  <label for="github">GitHub URL</label>
  <input id="github" type="url">

  <label for="skills">Skills Summary</label>
  <textarea id="skills"></textarea>

  <div class="actions">
    <button id="save">Save</button>
    <span id="status"></span>
  </div>

<script src="options.js"></script>
</body>
</html>
